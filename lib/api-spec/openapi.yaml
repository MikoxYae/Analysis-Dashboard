openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: mongodb
    description: MongoDB analytics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /mongo/list-databases:
    post:
      operationId: mongoListDatabases
      tags: [mongodb]
      summary: List available MongoDB databases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MongoUri"
      responses:
        "200":
          description: List of databases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MongoListResult"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mongo/list-collections:
    post:
      operationId: mongoListCollections
      tags: [mongodb]
      summary: List collections in a database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MongoUriDb"
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MongoListResult"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /mongo/analytics:
    post:
      operationId: mongoAnalytics
      tags: [mongodb]
      summary: Fetch analytics from MongoDB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MongoConfig"
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsData"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MongoUri:
      type: object
      required: [uri]
      properties:
        uri:
          type: string

    MongoUriDb:
      type: object
      required: [uri, database]
      properties:
        uri:
          type: string
        database:
          type: string

    MongoConfig:
      type: object
      required: [uri, database, collection]
      properties:
        uri:
          type: string
        database:
          type: string
        collection:
          type: string
        userIdField:
          type: string
        createdAtField:
          type: string
        lastActiveField:
          type: string
        blockedField:
          type: string
        botIdField:
          type: string

    MongoListResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: string

    DailyPoint:
      type: object
      required: [day, users]
      properties:
        day:
          type: string
        users:
          type: integer

    AnalyticsData:
      type: object
      required: [todayNew, unique, active7d, todayActive, common, blocked, posts, batches, convLinks, dailyNewUsers, active7dPercent]
      properties:
        todayNew:
          type: integer
        unique:
          type: integer
        active7d:
          type: integer
        todayActive:
          type: integer
        common:
          type: integer
        blocked:
          type: integer
        posts:
          type: integer
        batches:
          type: integer
        convLinks:
          type: integer
        growthPercent:
          type: ["number", "null"]
        active7dPercent:
          type: number
        dailyNewUsers:
          type: array
          items:
            $ref: "#/components/schemas/DailyPoint"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
